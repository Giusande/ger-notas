<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Categorias</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/categorias.css" />
  </head>
  <body>
    <!-- CABEÇALHO -->
    <header class="cabecalho">
      <h1>Categorias</h1>
      <button class="btn-novo" onclick="abrirModal()">+ Nova Categoria</button>
    </header>

    <!-- ESTATÍSTICAS -->
    <section class="estatisticas">
      <div class="stat-box">
        <span class="stat-numero" id="total-categorias">0</span>
        <span class="stat-label">Total de Categorias</span>
      </div>
      <div class="stat-box">
        <span class="stat-numero" id="top-nome">—</span>
        <span class="stat-label">Categoria com mais notas</span>
      </div>
      <div class="stat-box">
        <span class="stat-numero" id="total-notas">0</span>
        <span class="stat-label">Total de Notas</span>
      </div>
    </section>

    <!-- LISTA DE CATEGORIAS -->
    <main class="container">
      <h2 class="subtitulo">Todas as Categorias</h2>
      <div class="grade" id="grade-categorias"></div>
      <div class="vazio" id="vazio">
        <p>Nenhuma categoria cadastrada.</p>
        <p>Clique em <strong>+ Nova Categoria</strong> para começar.</p>
      </div>
    </main>

    <!-- MODAL: CRIAR / EDITAR -->
    <div class="overlay" id="overlay-modal" onclick="fecharModal()">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-cabecalho">
          <h3 id="modal-titulo">Nova Categoria</h3>
          <button class="btn-fechar" onclick="fecharModal()">✕</button>
        </div>

        <label class="campo-label">Nome</label>
        <input
          class="campo-input"
          id="campo-nome"
          type="text"
          placeholder="Ex: Faculdade, Trabalho…"
        />

        <label class="campo-label">Cor</label>
        <div class="cores-grupo">
          <button
            class="cor-btn"
            data-cor="#3b82f6"
            style="background: #3b82f6"
            onclick="selecionarCor('#3b82f6', this)"
          ></button>
          <button
            class="cor-btn"
            data-cor="#8b5cf6"
            style="background: #8b5cf6"
            onclick="selecionarCor('#8b5cf6', this)"
          ></button>
          <button
            class="cor-btn"
            data-cor="#22c55e"
            style="background: #22c55e"
            onclick="selecionarCor('#22c55e', this)"
          ></button>
        </div>

        <label class="campo-label">Descrição</label>
        <textarea
          class="campo-input campo-textarea"
          id="campo-descricao"
          placeholder="Descreva esta categoria…"
        ></textarea>

        <div class="modal-rodape">
          <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
          <button class="btn-salvar" onclick="salvarCategoria()">Salvar</button>
        </div>
      </div>
    </div>

    <!-- MODAL: CONFIRMAR EXCLUSÃO -->
    <div class="overlay" id="overlay-excluir" onclick="fecharExcluir()">
      <div class="modal modal-pequeno" onclick="event.stopPropagation()">
        <div class="modal-cabecalho">
          <h3>Excluir Categoria</h3>
          <button class="btn-fechar" onclick="fecharExcluir()">✕</button>
        </div>
        <p class="texto-confirmar">
          Deseja excluir a categoria <strong id="nome-excluir"></strong>? Essa
          ação não pode ser desfeita.
        </p>
        <div class="modal-rodape">
          <button class="btn-cancelar" onclick="fecharExcluir()">
            Cancelar
          </button>
          <button class="btn-excluir" onclick="confirmarExclusao()">
            Excluir
          </button>
        </div>
      </div>
    </div>

    <!-- AVISO (TOAST) -->
    <div class="toast" id="toast"></div>

    <script src="./js/categorias.js"></script>
  </body>
</html>
